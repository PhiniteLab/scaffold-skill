name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tooling
        run: python -m pip install --upgrade pip ruff pyright pytest pyyaml

      - name: Lint
        run: ruff check .

      - name: Type check
        run: pyright scripts

      - name: Test
        run: pytest -q || [ $? -eq 5 ]

      - name: Path-safety gate
        run: python scripts/check_paths.py
